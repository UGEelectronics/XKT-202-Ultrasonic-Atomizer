name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp "XKT202 humidifier.html" _site/index.html
          cp "XKT202 humidifier.html" "_site/XKT202 humidifier.html"
          sed -i 's|XKT-202%20PCB.jpg|pcb.jpg|g' _site/index.html "_site/XKT202 humidifier.html"
          cp "XKT-202 PCB.jpg" _site/pcb.jpg
          cp Module_Schematic.png _site/Module_Schematic.png
          printf '' > _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
